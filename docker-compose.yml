services:
  postgres:
    image: postgres:16-alpine
    container_name: ithaca-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ithaca
      POSTGRES_PASSWORD: ithaca
      POSTGRES_DB: ithaca
    volumes:
      - ithaca_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ithaca -d ithaca"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.33.0
    container_name: ithaca-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_SMTP_BIND_ADDR: "0.0.0.0:1025"
      MP_UI_BIND_ADDR: "0.0.0.0:8025"
      MP_DATABASE: /data/mailpit.db
    volumes:
      - ithaca_mailpit_data:/data

volumes:
  ithaca_pg_data:
  ithaca_mailpit_data:
